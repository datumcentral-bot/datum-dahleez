<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | DATUM DAHLEEZ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <style>
        :root {
            --bg: #090909;
            --surface: #141414;
            --border: #313131;
            --gold: #D4AF37;
            --text: #f0f0f0;
            --muted: #888;
            --soft-silver: #B6BCC5;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        .display { font-family: 'Cormorant Garamond', Georgia, serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .nav { display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; border-bottom: 1px solid var(--border); }
        .nav__logo { font-family: 'Cormorant Garamond', serif; font-size: 1.25rem; letter-spacing: 0.05em; }
        .nav__links { display: flex; gap: 1.5rem; }
        .nav__link { color: var(--text); text-decoration: none; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.08em; }
        .nav__link:hover { color: var(--gold); }
        .dashboard { max-width: 1100px; margin: 0 auto; padding: 3rem 2rem; }
        .dashboard__header { margin-bottom: 2.5rem; }
        .dashboard__title { font-size: clamp(2rem, 4vw, 2.8rem); margin: 0; }
        .dashboard__subtitle { color: var(--muted); margin-top: 0.5rem; }
        .dashboard__grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; }
        .dashboard__card { padding: 1.5rem; border: 1px solid var(--border); background: var(--surface); }
        .dashboard__card-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--gold); margin-bottom: 0.75rem; font-family: 'JetBrains Mono', monospace; }
        .dashboard__card-value { font-size: 1.5rem; font-weight: 500; }
        .dashboard__card-meta { font-size: 0.85rem; color: var(--muted); margin-top: 0.25rem; }
        .dashboard__list { list-style: none; margin-top: 0.5rem; }
        .dashboard__list-item { padding: 0.75rem 0; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        .dashboard__list-item:last-child { border-bottom: none; }
        .dashboard__list-meta { font-size: 0.75rem; color: var(--muted); font-family: 'JetBrains Mono', monospace; }
        .btn { display: inline-block; padding: 0.75rem 1.5rem; border: 1px solid var(--border); background: transparent; color: var(--text); font-family: inherit; font-size: 0.8rem; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; text-decoration: none; cursor: pointer; transition: all 0.35s ease; }
        .btn:hover { border-color: var(--gold); color: var(--gold); }
        .btn--primary { border-color: var(--gold); color: var(--gold); }
        .btn--primary:hover { background: var(--gold); color: var(--bg); }
        .empty-state { text-align: center; padding: 3rem; color: var(--muted); }
        @media (max-width: 640px) {
            .nav { padding: 1rem; }
            .dashboard { padding: 2rem 1rem; }
        }
    </style>
</head>
<body>
    <nav class="nav">
        <div class="nav__logo">Datum Dahleez</div>
        <div class="nav__links">
            <a href="index.html" class="nav__link">EIS Platform</a>
            <a href="collections.html" class="nav__link">Collections</a>
            <a href="customer.html" class="nav__link">Dashboard</a>
        </div>
    </nav>

    <main class="dashboard">
        <div class="dashboard__header">
            <h1 class="dashboard__title display">Your Dashboard</h1>
            <p class="dashboard__subtitle">Manage your projects, consultations, and preferences.</p>
        </div>

        <div class="dashboard__grid">
            <div class="dashboard__card">
                <div class="dashboard__card-title">Profile Memory</div>
                <div id="profile-summary">
                    <div class="empty-state">Loading profile...</div>
                </div>
            </div>

            <div class="dashboard__card">
                <div class="dashboard__card-title">Project History</div>
                <div id="project-history">
                    <div class="empty-state">No completed consultations yet.</div>
                </div>
            </div>

            <div class="dashboard__card">
                <div class="dashboard__card-title">Saved Preferences</div>
                <div id="saved-preferences">
                    <div class="empty-state">No saved preferences yet.</div>
                </div>
            </div>

            <div class="dashboard__card">
                <div class="dashboard__card-title">Quick Actions</div>
                <div style="display:flex; flex-direction:column; gap:0.75rem;">
                    <a href="index.html" class="btn btn--primary">Start New Consultation</a>
                    <button class="btn" onclick="window.clearDashboard()">Clear All Data</button>
                </div>
            </div>
        </div>
    </main>

    <script src="js/eis/loader.js"></script>
    <script>
        function loadDashboard() {
            try {
                const profile = JSON.parse(localStorage.getItem('eis_customer_profile') || '{}');
                const sessions = JSON.parse(localStorage.getItem('eis_sessions_history') || '[]');
                const prefs = profile.preferences || {};

                const profileSummary = document.getElementById('profile-summary');
                if (Object.keys(prefs).length === 0) {
                    profileSummary.innerHTML = '<div class="empty-state">No preferences saved yet. Complete a consultation to build your profile.</div>';
                } else {
                    const entries = Object.entries(prefs).filter(([,v]) => v).map(([k,v]) => `<div class="dashboard__list-item"><strong>${k}:</strong> ${v}</div>`).join('');
                    profileSummary.innerHTML = entries || '<div class="empty-state">No preferences saved yet.</div>';
                }

                const historyContainer = document.getElementById('project-history');
                if (!sessions || sessions.length === 0) {
                    historyContainer.innerHTML = '<div class="empty-state">No completed consultations yet.</div>';
                } else {
                    historyContainer.innerHTML = '<ul class="dashboard__list">' + sessions.slice(0, 10).map(s => `
                        <li class="dashboard__list-item">
                            <div>${s.space || 'Unknown space'}</div>
                            <div class="dashboard__list-meta">${s.emotion || 'N/A'} · ${s.budget || 'N/A'} · ${s.completedAt ? new Date(s.completedAt).toLocaleDateString() : 'N/A'}</div>
                        </li>
                    `).join('') + '</ul>';
                }

                const prefContainer = document.getElementById('saved-preferences');
                const relevantPrefs = ['selectedSpace', 'targetEmotion', 'budgetTier', 'stylePreference', 'theme'];
                const saved = relevantPrefs.map(k => ({ key: k, value: prefs[k] })).filter(p => p.value);
                if (saved.length === 0) {
                    prefContainer.innerHTML = '<div class="empty-state">No saved preferences yet.</div>';
                } else {
                    prefContainer.innerHTML = '<ul class="dashboard__list">' + saved.map(p => `
                        <li class="dashboard__list-item"><strong>${p.key}:</strong> ${p.value}</li>
                    `).join('') + '</ul>';
                }
            } catch (e) {
                console.error('Dashboard load error:', e);
            }
        }

        window.clearDashboard = function() {
            if (!confirm('Clear all saved data including consultation history and preferences?')) return;
            localStorage.removeItem('eis_session_v1');
            localStorage.removeItem('eis_customer_profile');
            localStorage.removeItem('eis_sessions_history');
            location.reload();
        };

        document.addEventListener('DOMContentLoaded', loadDashboard);
    </script>
</body>
</html>
