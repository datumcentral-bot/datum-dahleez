<!doctype html>
<html class="no-js" lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#0a0a0a">
    <title>Your Shopping Cart | Datum Dahleez Store</title>
    <style>
        body { background: #0a0a0a; color: #fff; font-family: Inter, Arial, sans-serif; }
        .page-width { max-width: 1200px; margin: 0 auto; padding: 2rem 1rem; }
        .header { padding: 1.5rem 0; border-bottom: 1px solid #222; margin-bottom: 2rem; }
        .header a { color: #fff; text-decoration: none; font-size: 1.5rem; font-weight: 700; }
        table { width: 100%; border-collapse: collapse; margin: 2rem 0; }
        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid #222; }
        th { color: #888; font-weight: 500; text-transform: uppercase; font-size: 0.85rem; }
        .btn { padding: 1rem 2rem; background: #0071e3; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; }
        .btn-secondary { background: #222; }
        .empty { text-align: center; padding: 4rem 1rem; color: #888; }
        .total { font-size: 1.5rem; font-weight: 700; text-align: right; margin: 2rem 0; }
        .cart-count { display: inline-block; background: #0071e3; color: #fff; border-radius: 50%; padding: 0.1rem 0.4rem; font-size: 0.75rem; margin-left: 0.5rem; }
        .qty-input { width: 70px; padding: 0.4rem; background: #0a0a0a; border: 1px solid #333; border-radius: 8px; color: #fff; }
    </style>
</head>
<body>
    <div class="header page-width">
        <a href="../index.html">DATUM DAHLEEZ <span class="cart-count" id="cart-count">0</span></a>
        <nav>
            <a href="checkout.html" class="btn" style="margin-left:auto;">Checkout</a>
        </nav>
        <hr style="border-color: #222; margin: 1rem 0;" />
    </div>
    <div class="page-width">
        <h1>Your Shopping Cart</h1>
        <div id="cart-empty" class="empty" style="display:none;">
            <p>Your cart is empty.</p>
            <a href="collections.html" class="btn">Continue Shopping</a>
        </div>
        <div id="cart-summary">
            <table>
                <thead>
                    <tr><th>Product</th><th>Price</th><th>Qty</th><th>Subtotal</th><th>Action</th></tr>
                </thead>
                <tbody id="cart-items"></tbody>
            </table>
            <div class="total">Total: Rs. <span id="cart-total">0</span></div>
            <div style="display:flex; gap:1rem; justify-content:flex-end; flex-wrap:wrap; margin-top:1rem;">
                <a href="checkout.html" class="btn">Proceed to Checkout</a>
                <button type="button" class="btn btn-secondary" onclick="clearCart()">Clear Cart</button>
            </div>
        </div>
    </div>
    <script src="../js/store-layout.js"></script>
    <script src="../js/shopping-cart.js"></script>
    <script src="../js/payment.js"></script>
    <script>
        function renderCart() {
            const cart = window.shoppingCart ? window.shoppingCart.cart : [];
            const container = document.getElementById('cart-items');
            const emptyEl = document.getElementById('cart-empty');
            const summaryEl = document.getElementById('cart-summary');
            const totalEl = document.getElementById('cart-total');
            const countEl = document.getElementById('cart-count');

            if (!container) return;
            if (countEl) countEl.textContent = window.shoppingCart ? window.shoppingCart.getItemCount() : 0;

            if (!cart.length) {
                if (emptyEl) emptyEl.style.display = 'block';
                if (summaryEl) summaryEl.style.display = 'none';
                return;
            }
            if (emptyEl) emptyEl.style.display = 'none';
            if (summaryEl) summaryEl.style.display = 'block';

            container.innerHTML = cart.map(item => `
                <tr>
                    <td>${item.name}</td>
                    <td>Rs. ${item.price.toLocaleString()}</td>
                    <td>
                        <input type="number" class="qty-input" value="${item.quantity}" min="1" onchange="updateCartQty('${item.id}', this.value)" />
                    </td>
                    <td>Rs. ${(item.price * item.quantity).toLocaleString()}</td>
                    <td><button type="button" class="btn btn-secondary" style="padding:0.4rem 0.8rem; font-size:0.8rem;" onclick="removeCartItem('${item.id}')">Remove</button></td>
                </tr>
            `).join('');

            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            if (totalEl) totalEl.textContent = total.toLocaleString();
        }

        function updateCartQty(productId, qty) {
            if (!window.shoppingCart) return;
            window.shoppingCart.updateQuantity(productId, parseInt(qty, 10));
            renderCart();
        }

        function removeCartItem(productId) {
            if (!window.shoppingCart) return;
            window.shoppingCart.removeItem(productId);
            renderCart();
        }

        function clearCart() {
            if (!window.shoppingCart) return;
            if (confirm('Clear all items from your cart?')) {
                window.shoppingCart.clearCart();
                renderCart();
            }
        }

        document.addEventListener('DOMContentLoaded', renderCart);
    </script>
</body>
</html>
