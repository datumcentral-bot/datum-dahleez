<!doctype html>
<html class="no-js" lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#0a0a0a">
    <title>Checkout | Datum Dahleez Store</title>
    <style>
        body { background: #0a0a0a; color: #fff; font-family: Inter, Arial, sans-serif; }
        .page-width { max-width: 1200px; margin: 0 auto; padding: 2rem 1rem; }
        .header { padding: 1.5rem 0; border-bottom: 1px solid #222; margin-bottom: 2rem; }
        .header a { color: #fff; text-decoration: none; font-size: 1.5rem; font-weight: 700; }
        .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 2rem; }
        .card { background: #111; border: 1px solid #222; border-radius: 12px; padding: 2rem; }
        .card h2 { margin-bottom: 1rem; font-size: 1.1rem; }
        input, textarea, select { width: 100%; padding: 0.75rem; background: #0a0a0a; border: 1px solid #333; border-radius: 8px; color: #fff; margin-bottom: 1rem; font-family: inherit; }
        .btn { padding: 1rem 2rem; background: #0071e3; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; width: 100%; }
        .btn-secondary { background: #222; }
        .summary-row { display: flex; justify-content: space-between; padding: 0.75rem 0; border-bottom: 1px solid #222; }
        .total { font-size: 1.5rem; font-weight: 700; }
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="header page-width">
        <a href="index.html">DATUM DAHLEEZ</a>
        <nav>
            <ul>
                <li><a href="cart.html" style="color:#fff;">Cart</a></li>
                <li><a href="collections.html" style="color:#fff;">Collections</a></li>
            </ul>
        </nav>
    </div>
    <div class="page-width">
        <h1>Checkout</h1>
        <div class="grid">
            <div class="card">
                <h2>Shipping Information</h2>
                <input type="text" id="checkout-name" placeholder="Full Name *" required />
                <input type="tel" id="checkout-phone" placeholder="Phone Number *" required />
                <input type="email" id="checkout-email" placeholder="Email *" required />
                <input type="text" id="checkout-address" placeholder="Full Address *" required />
                <input type="text" id="checkout-city" placeholder="City *" required />
                <textarea id="checkout-notes" rows="3" placeholder="Order Notes (optional)"></textarea>

                <h2 style="margin-top:2rem;">Payment Method</h2>
                <select id="checkout-payment">
                    <option value="cash_on_delivery">Cash on Delivery</option>
                    <option value="bank_transfer">Bank Transfer</option>
                    <option value="card">Card (Coming Soon)</option>
                </select>

                <button class="btn" style="margin-top:1rem;" onclick="placeOrder()">Place Order</button>
            </div>
            <div class="card">
                <h2>Order Summary</h2>
                <div id="checkout-items"></div>
                <div class="summary-row total" style="margin-top:1rem; border-top:2px solid #333; padding-top:1rem;">
                    <span>Total</span>
                    <span id="checkout-total">Rs. 0</span>
                </div>
            </div>
        </div>
    </div>
    <script src="../js/shopping-cart.js"></script>
    <script src="../js/payment.js"></script>
    <script>
        function renderCheckout() {
            const cart = window.shoppingCart ? window.shoppingCart.cart : [];
            const container = document.getElementById('checkout-items');
            const totalEl = document.getElementById('checkout-total');
            if (!container) return;
            if (!cart.length) {
                container.innerHTML = '<p style="color:#888;">Your cart is empty.</p>';
                if (totalEl) totalEl.textContent = 'Rs. 0';
                return;
            }
            container.innerHTML = cart.map(item => `
                <div class="summary-row">
                    <span>${item.name} x${item.quantity}</span>
                    <span>Rs. ${(item.price * item.quantity).toLocaleString()}</span>
                </div>
            `).join('');
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            if (totalEl) totalEl.textContent = 'Rs. ' + total.toLocaleString();
        }

        function placeOrder() {
            const name = document.getElementById('checkout-name').value.trim();
            const phone = document.getElementById('checkout-phone').value.trim();
            const email = document.getElementById('checkout-email').value.trim();
            const address = document.getElementById('checkout-address').value.trim();
            const city = document.getElementById('checkout-city').value.trim();
            const payment = document.getElementById('checkout-payment').value;
            const notes = document.getElementById('checkout-notes').value.trim();

            if (!name || !phone || !email || !address || !city) {
                alert('Please fill in all required fields.');
                return;
            }

            const cart = window.shoppingCart ? window.shoppingCart.cart : [];
            if (!cart.length) {
                alert('Your cart is empty.');
                return;
            }

            const orderId = 'DD-' + Date.now();
            const order = {
                id: orderId,
                items: cart,
                total: cart.reduce((sum, item) => sum + (item.price * item.quantity), 0),
                customer: { name, phone, email, address, city, notes },
                paymentMethod: payment,
                status: 'pending',
                createdAt: new Date().toISOString()
            };

            const orders = JSON.parse(localStorage.getItem('datum_dahleez_orders') || '[]');
            orders.push(order);
            localStorage.setItem('datum_dahleez_orders', JSON.stringify(orders));

            if (window.shoppingCart) {
                window.shoppingCart.clearCart();
            }

            alert(`Order placed successfully!\n\nOrder ID: ${orderId}\nTotal: Rs. ${order.total.toLocaleString()}\nPayment: ${payment.replace(/_/g, ' ')}\n\nWe will contact you shortly.`);
            window.location.href = 'index.html';
        }

        document.addEventListener('DOMContentLoaded', renderCheckout);
    </script>
</body>
</html>
